<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;">
  <div data-site-header="1" class="site-header">
    <div class="site-header__bar">
      <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
        <span style="width:34px; height:34px; border-radius:50%; background:#F7B916; display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1; color:#3F3413;">☺</span>
        <span style="display:flex; flex-direction:column; line-height:0.9; font-family:Anton, sans-serif; text-transform:uppercase; color:#FFF8EC;">
          <span style="font-size:clamp(15px,2.2vw,19px);">Happy People</span>
          <span style="font-size:clamp(9px,1.2vw,11px); letter-spacing:0.4em; color:#F7B916;">Rentals</span>
        </span>
      </a>

      <nav class="{{ navClass }}" aria-label="Main">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" class="{{ l.cls }}">{{ l.label }}</a>
        </sc-for>
        <a href="Quote.dc.html" class="btn btn--yellow">Get a quote</a>
      </nav>

      <button type="button" onClick="{{ toggle }}" aria-label="Menu" class="{{ burgerClass }}">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="{{ spacerClass }}"></div>
  <div class="quick-bar">
    <a href="tel:+13435585631" class="btn btn--ghost">Call 343-558-5631</a>
    <a href="Quote.dc.html" class="btn btn--yellow">Get a quote</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;overlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const LINKS = [
  { href: "index.html", label: "Home" },
  { href: "Catalog.dc.html", label: "Rentals" },
  { href: "Packages.dc.html", label: "Packages" },
  { href: "About.dc.html", label: "About" },
  { href: "Contact.dc.html", label: "Contact" }
];

class Component extends DCLogic {
  state = { open: false, narrow: false };

  componentDidMount() {
    this._el = document.querySelector('[data-site-header]');
    this._onResize = () => {
      const narrow = window.innerWidth < 860;
      if (narrow !== this.state.narrow) this.setState({ narrow, open: false });
    };
    this._onResize();
    window.addEventListener('resize', this._onResize);

    // Over the home video the bar starts transparent and turns solid once the hero scrolls away.
    const overlay = this.props.overlay;
    this._onScroll = () => {
      if (!this._el) return;
      const solid = !overlay || this.state.open || window.scrollY > Math.max(120, window.innerHeight - 120);
      this._el.style.background = solid ? '#3F3413' : 'linear-gradient(180deg, rgba(20,16,6,0.6), rgba(20,16,6,0))';
      this._el.style.boxShadow = solid ? '0 6px 26px rgba(20,16,6,0.28)' : 'none';
    };
    this._onScroll();
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentDidUpdate() { if (this._onScroll) this._onScroll(); }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('scroll', this._onScroll);
  }

  renderVals() {
    const { narrow, open } = this.state;
    const path = (window.location.pathname.split('/').pop() || 'index.html');
    return {
      toggle: () => this.setState((s) => ({ open: !s.open })),
      links: LINKS.map((l) => ({ ...l, cls: l.href === path ? 'is-current' : '' })),
      navClass: narrow ? (open ? 'site-nav site-nav--open' : 'site-nav site-nav--hidden') : 'site-nav',
      burgerClass: narrow ? 'burger' : 'site-nav--hidden',
      spacerClass: this.props.overlay ? 'site-nav--hidden' : 'header-spacer'
    };
  }
}
</script>
</body>
</html>
