<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;">
  <div data-site-header="1" style="position:fixed; top:0; left:0; right:0; z-index:60; background:#3F3413; transition:background 260ms ease, box-shadow 260ms ease;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px clamp(18px,5vw,40px);">
      <a href="index.html" style="display:flex; align-items:center; gap:12px; text-decoration:none;">
        <span style="width:34px; height:34px; border-radius:50%; background:#F7B916; display:flex; align-items:center; justify-content:center; font-size:19px; line-height:1; color:#3F3413;">☺</span>
        <span style="display:flex; flex-direction:column; line-height:0.9; font-family:Anton, sans-serif; text-transform:uppercase; color:#FFF8EC;">
          <span style="font-size:clamp(15px,2.2vw,19px);">Happy People</span>
          <span style="font-size:clamp(9px,1.2vw,11px); letter-spacing:0.4em; color:#F7B916;">Rentals</span>
        </span>
      </a>

      <nav style="{{ navStyle }}">
        <a href="index.html" style="color:#FFF8EC; text-decoration:none; font-size:14.5px; font-weight:500;">Home</a>
        <a href="Catalog.dc.html" style="color:#FFF8EC; text-decoration:none; font-size:14.5px; font-weight:500;">Rentals</a>
        <a href="Packages.dc.html" style="color:#FFF8EC; text-decoration:none; font-size:14.5px; font-weight:500;">Packages</a>
        <a href="About.dc.html" style="color:#FFF8EC; text-decoration:none; font-size:14.5px; font-weight:500;">About</a>
        <a href="Contact.dc.html" style="color:#FFF8EC; text-decoration:none; font-size:14.5px; font-weight:500;">Contact</a>
        <a href="Quote.dc.html" style="padding:11px 20px; border-radius:999px; background:#F7B916; color:#3F3413; font-weight:700; font-size:14.5px; text-decoration:none;">Get a Quote</a>
      </nav>

      <button type="button" onClick="{{ toggle }}" aria-label="Menu" style="{{ burgerStyle }}">
        <span style="display:block; width:20px; height:2px; background:#3F3413;"></span>
        <span style="display:block; width:20px; height:2px; background:#3F3413;"></span>
        <span style="display:block; width:20px; height:2px; background:#3F3413;"></span>
      </button>
    </div>
  </div>
  <div style="{{ spacerStyle }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:90},&quot;overlay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: false, narrow: false };

  componentDidMount() {
    const el = document.querySelector('[data-site-header]');
    this._el = el;
    this._onResize = () => {
      const narrow = window.innerWidth < 860;
      if (narrow !== this.state.narrow) this.setState({ narrow, open: false });
    };
    this._onResize();
    window.addEventListener('resize', this._onResize);

    const overlay = this.props.overlay;
    this._onScroll = () => {
      if (!this._el) return;
      const solid = !overlay || window.scrollY > Math.max(120, window.innerHeight - 120);
      this._el.style.background = solid ? '#3F3413' : 'linear-gradient(180deg, rgba(20,16,6,0.55), rgba(20,16,6,0))';
      this._el.style.boxShadow = solid ? '0 6px 26px rgba(20,16,6,0.28)' : 'none';
    };
    this._onScroll();
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('scroll', this._onScroll);
  }

  renderVals() {
    const { narrow, open } = this.state;
    const base = "display:flex; align-items:center; gap:clamp(16px,2.4vw,30px);";
    return {
      toggle: () => this.setState((s) => ({ open: !s.open })),
      navStyle: narrow
        ? (open
            ? "display:flex; flex-direction:column; align-items:flex-start; gap:18px; position:absolute; top:100%; left:0; right:0; background:#3F3413; padding:22px clamp(18px,5vw,40px) 28px; box-shadow:0 18px 40px rgba(20,16,6,0.35);"
            : "display:none;")
        : base,
      burgerStyle: narrow
        ? "display:flex; flex-direction:column; gap:4px; align-items:center; justify-content:center; width:42px; height:42px; border:none; border-radius:10px; background:#F7B916; cursor:pointer;"
        : "display:none;",
      spacerStyle: this.props.overlay ? "display:none;" : "height:66px;"
    };
  }
}
</script>
</body>
</html>
